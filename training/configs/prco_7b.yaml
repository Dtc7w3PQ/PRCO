data:
  train_files: ./data/train.jsonl
  val_files: ./data/val.jsonl
  prompt_key: problem
  answer_key: answer
  image_key: images
  video_key: videos
  image_dir: ./data/train_images
  val_image_dir: ./data/val_images
  video_fps: 2.0
  max_prompt_length: 5000
  max_response_length: 2048
  caption_max_tokens: 1024
  truncation: right
  rollout_batch_size: 384
  mini_rollout_batch_size: null
  val_batch_size: 2048
  caption_prompt: ./prompts/observer.jinja
  caption_use_question: true
  solve_prompt: ./prompts/solver.jinja
  solve_use_images: false
  solve_use_images_switch_step: 40
  override_chat_template: null
  shuffle: true
  seed: 1
  min_pixels: 262144
  max_pixels: 2359296
  filter_overlong_prompts: true

algorithm:
  adv_estimator: grpo
  disable_kl: true
  online_filtering: true
  filter_key: overall
  filter_low: 0.01
  filter_high: 0.99

worker:
  actor:
    global_batch_size: 96
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 2
    max_grad_norm: 1.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    loss_avg_mode: token
    padding_free: true
    dynamic_batching: true
    ulysses_size: 1
    model:
      model_path: Qwen/Qwen2.5-VL-7B-Instruct
      enable_gradient_checkpointing: true
      trust_remote_code: false
      freeze_vision_tower: false
    optim:
      lr: 1.0e-6
      weight_decay: 1.0e-2
      strategy: adamw
      lr_warmup_ratio: 0.0
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
    offload:
      offload_params: true
      offload_optimizer: true
  rollout:
    n: 8
    temperature: 1.0
    top_p: 1.0
    frequency_penalty: 0.0
    limit_images: 0
    gpu_memory_utilization: 0.8
    enforce_eager: false
    enable_chunked_prefill: false
    tensor_parallel_size: 1
    disable_tqdm: false
    val_override_config:
      temperature: 0.6
      top_p: 0.95
      n: 1
  reward:
    reward_function: ./rewards/math.py:compute_score
    enable_solver_update_sampling: true
    solver_update_ratio: 1
    enable_solver_update_group_filter: true
    solver_update_filter_key: accuracy
    enable_solver_update_random_sampling: true
    caption_reward_key: accuracy

trainer:
  max_steps: 200
  project_name: prco
  experiment_name: prco_7b
  logger: [console, file]
  nnodes: 1
  n_gpus_per_node: 8
  max_try_make_batch: 20
  val_freq: 20
  val_before_train: true
  val_only: false
  val_generations_to_log: 50
  save_freq: 10
  save_limit: 3
  save_model_only: true
  save_checkpoint_path: ./outputs/prco_7b/checkpoints
  load_checkpoint_path: null
  find_last_checkpoint: false
